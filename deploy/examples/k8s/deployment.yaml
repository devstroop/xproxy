apiVersion: apps/v1
kind: Deployment
metadata:
  name: xproxy
  labels:
    app: xproxy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: xproxy
  template:
    metadata:
      labels:
        app: xproxy
    spec:
      containers:
        - name: xproxy
          image: ghcr.io/devstroop/xproxy:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: forward
              containerPort: 3128
              protocol: TCP
            - name: reverse
              containerPort: 8080
              protocol: TCP
          env:
            - name: RUST_LOG
              value: info
            - name: CONFIG_PATH
              value: /app/config.toml
          # Config via ConfigMap (example) or mounted xproxy.toml
          volumeMounts:
            - name: config
              mountPath: /app/config.toml
              subPath: config.toml
              readOnly: true
            # CA as secret (optional, for forward MITM)
            # - name: ca
            #   mountPath: /app/ca.crt
            #   subPath: ca.crt
            #   readOnly: true
            # - name: ca
            #   mountPath: /app/ca.key
            #   subPath: ca.key
            #   readOnly: true
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: [ALL]
      volumes:
        - name: config
          configMap:
            name: xproxy-config
            items:
              - key: config.toml
                path: config.toml
        # - name: ca
        #   secret:
        #     secretName: xproxy-ca
        #     defaultMode: 0400
      securityContext:
        seccompProfile:
          type: RuntimeDefault
