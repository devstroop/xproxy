apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: xproxy
  annotations:
    ingressclass.kubernetes.io/is-default-class: "false"
spec:
  controller: k8s.io/xproxy
  # For xproxy as reverse ingress (router/LB/TLS), reference this class in Ingress:
  # spec.ingressClassName: xproxy
