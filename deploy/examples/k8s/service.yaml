apiVersion: v1
kind: Service
metadata:
  name: xproxy
  labels:
    app: xproxy
spec:
  selector:
    app: xproxy
  ports:
    - name: forward
      port: 3128
      targetPort: 3128
      protocol: TCP
    - name: reverse
      port: 8080
      targetPort: 8080
      protocol: TCP
  type: ClusterIP
---
