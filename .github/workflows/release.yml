name: release

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Determine next tag
        id: tag
        run: |
          set -e
          git fetch --tags --force
          # Latest semver tag or fallback to Cargo.toml version
          LATEST=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.1.0")
          echo "latest tag: $LATEST"
          # Strip leading v and any prerelease suffix
          VER=${LATEST#v}
          VER=${VER%%-*}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VER"
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-1}
          PATCH=${PATCH:-0}
          # Bump patch for next release (simple; use minor bump if needed via workflow_dispatch input)
          NEXT_PATCH=$((PATCH + 1))
          NEXT="v${MAJOR}.${MINOR}.${NEXT_PATCH}"
          BRANCH="${GITHUB_REF_NAME}"
          PRERELEASE="false"
          if [[ "$BRANCH" == "develop" ]]; then
            PRERELEASE="true"
            # Beta counter: count existing beta tags for NEXT version + run_number for uniqueness
            BETA_COUNT=$(git tag --list "${NEXT}-beta.*" | wc -l)
            BETA_COUNT=$((BETA_COUNT + 1))
            # Use run_number to ensure monotonic, fallback to BETA_COUNT
            RUN_BETA="${GITHUB_RUN_NUMBER:-$BETA_COUNT}"
            TAG="${NEXT}-beta.${RUN_BETA}"
          else
            # main -> stable
            TAG="${NEXT}"
            # If tag already exists (re-run), append build number
            if git rev-parse "$TAG" >/dev/null 2>&1; then
              TAG="${NEXT}-build.${GITHUB_RUN_NUMBER}"
            fi
          fi
          echo "next tag: $TAG (prerelease=$PRERELEASE, branch=$BRANCH)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Cargo metadata version
        run: |
          echo "Cargo.toml version: $(grep -m1 '^version' Cargo.toml | cut -d'\"' -f2 || grep -m1 'version.workspace' Cargo.toml)"
          cargo --version
          rustc --version

      - name: Build release binary
        run: cargo build --release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          prerelease: ${{ steps.tag.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.tag.outputs.prerelease != 'true' }}
          generate_release_notes: true
          files: |
            target/release/xproxy
            Cargo.lock
            config.example.toml
          body: |
            **Branch:** `${{ steps.tag.outputs.branch }}` → `${{ steps.tag.outputs.tag }}` (`prerelease=${{ steps.tag.outputs.prerelease }}`)

            - main → stable latest (`vX.Y.Z`, `make_latest=true`)
            - develop → pre-release beta (`vX.Y.Z-beta.N`, `prerelease=true`)

            Built from `${{ github.sha }}` on `${{ github.ref_name }}`.

            ```sh
            cargo build --release
            # binary: target/release/xproxy
            # docker: docker build -t xproxy:${{ steps.tag.outputs.tag }} .
            # compose: docker compose up
            # k8s: kubectl apply -f examples/k8s/
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
